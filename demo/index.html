<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theme editor demo</title>
  <link rel="stylesheet" href="./demo.css">
  <script type="module" src="./demo.js"></script>
</head>
<body>
  <header>
    <h1>Theme editor demo</h1>
    <button type="button" id="open-editor">Appearance</button>
  </header>
  <main>
    <section class="card">
      <h2>Sample card</h2>
      <p>Body text on a surface, with <a href="#">a link</a> and a muted note.</p>
      <p class="muted">Muted secondary text.</p>
      <div class="row"><button type="button" class="primary">Primary</button><button type="button">Secondary</button><span class="chip">Accent chip</span></div>
    </section>
    <section class="card">
      <h2>Another surface</h2>
      <ul><li>Neutral hue drives backgrounds and borders.</li><li>Brand hue drives links and primary actions.</li><li>Accent hue drives highlights and focus.</li></ul>
    </section>
  </main>
</body>
</html>
